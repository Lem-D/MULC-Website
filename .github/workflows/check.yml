# Builds the site and checks its links on every pull request and on pushes to any branch
# other than main (main is checked by the deploy workflow before it publishes).
# A red X here usually means a typo in a src/content/*.json file or a link to a page or file
# that doesn't exist. Open the failed run to see which one.
name: Build and check links

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Check outside links (report only)
        # Social sites often block automated checks, so this step never fails the run.
        continue-on-error: true
        run: node scripts/check-links.mjs --external
